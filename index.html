<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apuestas · Historial</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="progress" class="progress" aria-hidden="true"></div>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>⚽ Apuestas</h1>
        <span class="last-update" id="ultima-act"></span>
      </div>
      <button class="btn-ghost refresh-btn" id="refresh" aria-label="Actualizar datos" title="Actualizar">🔄</button>
    </header>

    <div id="banner"></div>
    <main id="view"></main>
  </div>

  <nav class="bottom-nav">
    <button class="navbtn" data-tab="reportes"><span class="navbtn-ico">📊</span><span class="navbtn-lbl">Reportes</span></button>
    <button class="navbtn active" data-tab="partidos"><span class="navbtn-ico">🥅</span><span class="navbtn-lbl">Partidos</span></button>
    <button class="navbtn" data-tab="cajeras"><span class="navbtn-ico">👩</span><span class="navbtn-lbl">Cajeras</span></button>
    <button class="navbtn" data-tab="config"><span class="navbtn-ico">⚙️</span><span class="navbtn-lbl">Config</span></button>
  </nav>

  <!-- Supabase JS desde CDN (sin build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
