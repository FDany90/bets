<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apuestas · Historial</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="progress" class="progress" aria-hidden="true"></div>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>⚽ Apuestas</h1>
        <span class="last-update" id="ultima-act"></span>
      </div>
      <nav class="tabs">
        <button class="tab" data-tab="reportes">Reportes</button>
        <button class="tab active" data-tab="partidos">Partidos</button>
        <button class="tab" data-tab="cajeras">Cajeras</button>
        <button class="tab tab-icon" data-tab="config" aria-label="Configuración" title="Configuración">⚙️</button>
      </nav>
    </header>

    <div id="banner"></div>
    <main id="view"></main>
  </div>

  <!-- Supabase JS desde CDN (sin build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
